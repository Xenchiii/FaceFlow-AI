version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: faceflow
      POSTGRES_USER: faceflow_user
      POSTGRES_PASSWORD: faceflow_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URI=postgresql://faceflow_user:faceflow_pass@postgres/faceflow
      - MONGO_URI=mongodb://mongodb:27017/faceflow
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - mongodb
      - redis
    volumes:
      - ./:/app
      - ./uploads:/app/uploads

volumes:
  postgres_data:
  mongo_data:
  redis_data: